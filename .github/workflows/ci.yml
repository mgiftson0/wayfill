name: CI

on:
  push:
    branches: [main, 'phase/*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # E2E runs only on non-CI environment (requires headed Chromium)
      # Uncomment and add Xvfb setup to run in CI:
      # - name: Install Playwright browsers
      #   run: npx playwright install chromium
      # - name: E2E tests
      #   run: xvfb-run npm run e2e
