<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Workday-style fixture</title></head>
<body>
<div data-automation-id="applicationPage">
  <h1>Apply: Senior Engineer</h1>
  <!-- Workday uses placeholder + data-automation-id, minimal labels -->
  <div class="wd-field">
    <label class="wd-label" for="input-1">First Name *</label>
    <input id="input-1" data-automation-id="legalNameSection_firstName" type="text" placeholder="First Name" />
  </div>
  <div class="wd-field">
    <label class="wd-label" for="input-2">Last Name *</label>
    <input id="input-2" data-automation-id="legalNameSection_lastName" type="text" placeholder="Last Name" />
  </div>
  <div class="wd-field">
    <label class="wd-label" for="input-3">Email Address *</label>
    <input id="input-3" data-automation-id="email" type="email" placeholder="Email Address" />
  </div>
  <div class="wd-field">
    <label class="wd-label" for="input-4">Phone</label>
    <input id="input-4" data-automation-id="phone" type="tel" placeholder="Phone" />
  </div>
  <div class="wd-field">
    <label class="wd-label" for="input-5">City</label>
    <input id="input-5" data-automation-id="city" type="text" placeholder="City" />
  </div>
  <div class="wd-field">
    <label class="wd-label" for="input-6">State</label>
    <input id="input-6" data-automation-id="state" type="text" placeholder="State" />
  </div>
  <!-- Radio group: work auth -->
  <fieldset>
    <legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="workAuth" value="Yes" /> Yes</label>
    <label><input type="radio" name="workAuth" value="No" /> No</label>
  </fieldset>
  <fieldset>
    <legend>Will you now or in the future require sponsorship?</legend>
    <label><input type="radio" name="sponsorship" value="Yes" /> Yes</label>
    <label><input type="radio" name="sponsorship" value="No" /> No</label>
  </fieldset>
</div>
</body>
</html>
