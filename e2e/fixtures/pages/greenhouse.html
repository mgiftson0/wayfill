<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Greenhouse-style fixture</title></head>
<body>
<form id="application-form">
  <h1>Apply for Software Engineer</h1>
  <!-- Personal -->
  <label for="first_name">First Name</label>
  <input id="first_name" name="first_name" type="text" />

  <label for="last_name">Last Name</label>
  <input id="last_name" name="last_name" type="text" />

  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" />

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" />

  <label for="linkedin_profile">LinkedIn Profile</label>
  <input id="linkedin_profile" name="linkedin_profile" type="url" />

  <!-- Work auth -->
  <label for="authorized">Are you legally authorized to work in the United States?</label>
  <select id="authorized" name="us_work_authorization">
    <option value="">-- Select --</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <label for="sponsorship">Will you now, or in the future, require visa sponsorship?</label>
  <select id="sponsorship" name="require_sponsorship">
    <option value="">-- Select --</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <!-- Resume -->
  <label for="resume">Resume/CV</label>
  <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" />
</form>
</body>
</html>
