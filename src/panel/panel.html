<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayfill AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="panel">
    <header class="panel-header">
      <div class="panel-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span>wayfill AI</span>
      </div>
      <div class="panel-actions">
        <button id="btn-analyze" class="btn btn-ghost btn-sm" title="Analyze job posting">Analyze</button>
        <button id="btn-fill" class="btn btn-primary btn-sm">Fill</button>
        <button id="btn-close" class="btn-icon" title="Close panel" aria-label="Close">✕</button>
      </div>
    </header>

    <!-- Job analysis result -->
    <section id="analysis-section" class="panel-section hidden" aria-live="polite">
      <div id="analysis-content"></div>
    </section>

    <!-- Fill result -->
    <section id="fill-section" class="panel-section hidden" aria-live="polite">
      <div id="fill-summary"></div>
    </section>

    <!-- Chat -->
    <section class="panel-chat">
      <div id="chat-messages" class="chat-messages" role="log" aria-label="AI chat messages"></div>
      <form id="chat-form" class="chat-input-row">
        <textarea
          id="chat-input"
          class="chat-input"
          placeholder="Ask about this application…"
          rows="1"
          aria-label="Chat with AI"
        ></textarea>
        <button type="submit" class="btn-send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </form>
    </section>
  </div>
  <script type="module" src="panel.ts"></script>
</body>
</html>
